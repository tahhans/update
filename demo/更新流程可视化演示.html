<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外置 Updater 更新流水线 · 流程图演示</title>
<style>
  :root{
    --bg:#0f141b; --panel:#1a2230; --panel2:#222c3d; --line:#334157;
    --text:#e9eff7; --muted:#93a3b8; --accent:#3d8bfd; --ok:#2eb872;
    --warn:#e8a33d; --bad:#e5534b; --red:#ff5a52;
    --cloud:#1c2f45; --cache:#243326; --local:#332a22;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text)}
  header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  header h1{font-size:17px;font-weight:600}
  header .sub{color:var(--muted);font-size:12px;margin-top:3px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .controls button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
  .controls button.active{border-color:var(--accent);background:#24364f}
  .controls button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .wrap{max-width:1280px;margin:0 auto;padding:16px 22px}

  .flow-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
  .flow-svg{width:100%;height:auto;display:block}
  .lane-label{font-size:12px;fill:var(--muted);font-weight:600}
  .node rect{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;rx:12}
  .node .nt{font-size:13px;font-weight:600;fill:var(--text)}
  .node .nd{font-size:10.5px;fill:var(--muted)}
  .node.pending rect{stroke:var(--line)}
  .node.active rect{stroke:var(--accent);stroke-width:2.5;filter:drop-shadow(0 0 8px rgba(61,139,253,.5))}
  .node.done rect{stroke:var(--ok)}
  .node.backup rect{stroke:var(--warn)}
  .node.fail rect{stroke:var(--bad)}
  .node .led{fill:#5a6a80}
  .node.active .led{fill:var(--accent)}
  .node.done .led{fill:var(--ok)}
  .node.backup .led{fill:var(--warn)}
  .node.fail .led{fill:var(--bad)}
  .edge{stroke:#3a4a61;stroke-width:2;fill:none}
  .edge.on{stroke:var(--accent)}
  .edge.done{stroke:var(--ok)}
  .edge.fail{stroke:var(--bad)}
  .pulse{fill:var(--red)}

  .status{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .status .step{font-size:14px;font-weight:600;min-width:200px}
  .status .desc{color:var(--muted);font-size:12.5px;flex:1;min-width:220px}
  .bar{height:10px;border-radius:6px;background:#0f151e;overflow:hidden;flex:1;min-width:160px}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3d8bfd,#66b3ff);transition:width .2s}
  .bar.done>i{background:var(--ok)}
  .bar.bad>i{background:var(--bad)}
  .status .pct{font-size:12px;color:var(--muted);width:48px;text-align:right}
  .btn-restart{display:none;background:var(--ok);border:none;color:#fff;border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer}
  .btn-restart.show{display:inline-block}

  .side{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:900px){.side{grid-template-columns:1fr}}
  .side .col{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .side h2{font-size:12px;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line)}
  .logs{padding:10px 14px;max-height:230px;overflow-y:auto;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.7}
  .log{display:grid;grid-template-columns:54px 1fr;gap:8px;padding:4px 0;border-bottom:1px dashed #26313f}
  .log .m{color:var(--accent)}
  .log .u{color:#c7d6e8;word-break:break-all}
  .log .note{grid-column:2;color:var(--muted);font-size:11px}
  .fs{padding:12px 14px;max-height:230px;overflow-y:auto;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.9}
  .node-row{display:flex;align-items:center;gap:7px}
  .node-row .indent{width:18px}
  .node-row .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .node-row .tag{margin-left:auto;font-size:10.5px;color:var(--muted)}
  .st-idle .dot{background:#5a6a80}
  .st-new .dot{background:var(--ok)}
  .st-backup .dot{background:var(--warn)}
  .st-replaced .dot{background:var(--accent)}
  .st-removed{opacity:.45}
  .st-removed .dot{background:#5a6a80}
  .st-removed .name{text-decoration:line-through}
  .st-blocked .dot{background:var(--bad)}

  .legend{display:flex;gap:16px;flex-wrap:wrap;padding:14px 22px 6px;max-width:1280px;margin:0 auto;font-size:11.5px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
  footer{padding:10px 22px 20px;color:var(--muted);font-size:12px;max-width:1280px;margin:0 auto}
</style>
</head>
<body>
<header>
  <div>
    <h1>外置 Updater 更新流水线 · 流程图演示</h1>
    <div class="sub">红点走到哪一步，就表示当前进行到哪一步；三段分别是云端服务器、本地暂存文件夹、安装目录（家里）。</div>
  </div>
  <div class="controls">
    <button id="scSuccess" class="active">成功更新</button>
    <button id="scCancel">中途取消</button>
    <button id="scRollback">失败回滚</button>
    <button id="btnRefresh" class="primary">手动刷新检查</button>
  </div>
</header>

<div class="wrap">
  <div class="flow-card">
    <svg class="flow-svg" id="flow" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div class="status">
    <div class="step" id="stepText">待开始</div>
    <div class="desc" id="stepDesc">点"手动刷新检查"，或启动时自动检查（距上次 ≥24h 才联网）。</div>
    <div class="bar" id="bar"><i></i></div>
    <div class="pct" id="pct">0%</div>
    <button class="btn-restart" id="btnRestart">重启软件</button>
  </div>

  <div class="side">
    <div class="col">
      <h2>背后：API 调用记录</h2>
      <div class="logs" id="logs"></div>
    </div>
    <div class="col">
      <h2>本地文件流转（家目录安装盘）</h2>
      <div class="fs" id="fsTree"></div>
    </div>
  </div>
</div>

<div class="legend">
  <span><i style="background:var(--ok)"></i>完成 / 校验通过</span>
  <span><i style="background:var(--warn)"></i>旧文件备份</span>
  <span><i style="background:var(--accent)"></i>覆盖就位 / 进行中</span>
  <span><i style="background:var(--bad)"></i>失败 / 拦截保留</span>
  <span><i style="background:#5a6a80"></i>已删除残片</span>
</div>
<footer>演示为流程模拟：URL、字节数、路径均按 Snow Shot 发布规范虚构；真实 updater 通过 stdout 逐行 JSON 帧把版本号、变更说明、进度、错误回传给主程序。</footer>

<script>
/* ===== 流程图节点与连线（数据驱动渲染） ===== */
const LANES = [
  {y:20,  h:170, fill:'#1c2f45', label:'① 云端服务器（GitHub Release / Gitee 兜底）'},
  {y:220, h:170, fill:'#243326', label:'② 本地暂存文件夹  install_dir\\.app-update\\'},
  {y:410, h:195, fill:'#332a22', label:'③ 安装目录（家里）  C:\\Program Files\\MyShot\\'},
];

const NODES = [
  {id:'fetch',    lane:0, x:70,  y:55,  t:'请求最新版本', d:'GET api.github.com/repos/{repo}/releases/latest\nGitee 兜底：gitee.com/api/v5/repos/...'},
  {id:'compare',  lane:0, x:470, y:55,  t:'比对版本 · 取回变更说明', d:'远端 1.5.7 > 本地 1.5.6\n帧回传 version + notes（changelog）'},
  {id:'download', lane:1, x:70,  y:255, t:'下载到暂存残片', d:'.app-update\\my-app-update.zip.part\nRange/206 断点续传，边下边写'},
  {id:'verify',   lane:1, x:470, y:255, t:'校验 SHA256 / 大小', d:'残片哈希与 .sha256 比对通过\n改名为 my-app-update.zip'},
  {id:'staging',  lane:1, x:870, y:255, t:'解压到 staging', d:'.app-update\\staging\\\n新版文件先落暂存区，不动安装目录'},
  {id:'wait',     lane:2, x:70,  y:452, t:'等待旧程序退出', d:'--parent-pid 轮询旧进程\n释放被占用的 exe 文件句柄'},
  {id:'backup',   lane:2, x:320, y:452, t:'备份旧文件', d:'install_dir\\*  →  .app-update\\backup\\\n逐文件备份，供失败回滚'},
  {id:'apply',    lane:2, x:570, y:452, t:'staging 覆盖到安装目录', d:'.app-update\\staging\\  →  install_dir\\\n先备份后替换，单 exe 旁置 .old'},
  {id:'verwrite', lane:2, x:820, y:452, t:'写回版本号', d:'version.txt  →  1.5.7'},
  {id:'launch',   lane:2, x:320, y:540, t:'拉起新版程序', d:'install_dir\\MyShot.exe\n脱离 updater 进程组启动'},
  {id:'probe',    lane:2, x:570, y:540, t:'启动探测标记', d:'写 .app-update\\.launch-marker\n新版删掉标记=起来了；超时未删则回滚'},
  {id:'cleanup',  lane:2, x:820, y:540, t:'清理临时文件', d:'删除 staging / backup / 安装包 / 标记\n失败版本保留为 .blocked 备查'},
];

const EDGES = [
  ['fetch','compare'], ['compare','download'], ['download','verify'], ['verify','staging'],
  ['staging','wait'], ['wait','backup'], ['backup','apply'], ['apply','verwrite'],
  ['verwrite','launch'], ['launch','probe'], ['probe','cleanup'],
];

const W = 200, H = 80;
const SVG_NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('flow');

function el(name, attrs){
  const e = document.createElementNS(SVG_NS, name);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function renderLanes(){
  LANES.forEach(l=>{
    svg.appendChild(el('rect',{x:16,y:l.y,width:1168,height:l.h,rx:14,fill:l.fill,opacity:.55}));
    const t = el('text',{x:30,y:l.y+24,class:'lane-label'});
    t.textContent = l.label; svg.appendChild(t);
  });
}

function renderNodes(){
  NODES.forEach(n=>{
    const g = el('g',{class:'node pending',id:'n-'+n.id});
    g.appendChild(el('rect',{x:n.x,y:n.y,width:W,height:H}));
    g.appendChild(el('circle',{class:'led',cx:n.x+14,cy:n.y+18,r:5}));
    const t1 = el('text',{class:'nt',x:n.x+28,y:n.y+22});
    t1.textContent = n.t; g.appendChild(t1);
    n.d.split('\n').forEach((line,i)=>{
      const t2 = el('text',{class:'nd',x:n.x+14,y:n.y+44+i*15});
      t2.textContent = line; g.appendChild(t2);
    });
    svg.appendChild(g);
  });
}

function anchor(n, side){
  if(side==='r') return [n.x+W, n.y+H/2];
  if(side==='l') return [n.x, n.y+H/2];
  if(side==='b') return [n.x+W/2, n.y+H];
  return [n.x+W/2, n.y];
}

function renderEdges(){
  EDGES.forEach(([a,b])=>{
    const A = NODES.find(n=>n.id===a), B = NODES.find(n=>n.id===b);
    let d;
    if(A.lane===B.lane){
      const [x1,y1] = anchor(A,'r'), [x2,y2] = anchor(B,'l');
      d = `M${x1},${y1} L${x2},${y2}`;
    } else {
      const [x1,y1] = anchor(A,'b'), [x2,y2] = anchor(B,'t');
      d = `M${x1},${y1} C ${x1},${(y1+y2)/2} ${x2},${(y1+y2)/2} ${x2},${y2}`;
    }
    svg.appendChild(el('path',{class:'edge',id:'e-'+a+'-'+b,d}));
    const bx = B.lane===A.lane?B.x:B.x+W/2, by = B.lane===A.lane?B.y+H/2:B.y;
    svg.appendChild(el('path',{d:'M0,0 L-8,-4 L-8,4 Z',fill:'#3a4a61',transform:`translate(${bx},${by})`}));
  });
}

renderLanes(); renderEdges(); renderNodes();

/* ===== 交互状态机 ===== */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const fmt = n => n.toLocaleString('zh-CN');

const STATE = {
  scenario:'success', busy:false, phase:'idle',
  local:'1.5.6', remote:'1.5.7', total:37764164, received:0,
  fs:[]
};

function initFS(){
  STATE.fs = [
    {id:'root', parent:null, name:'C:\\Program Files\\MyShot\\', state:'idle', tag:'安装目录'},
    {id:'exe', parent:'root', name:'MyShot.exe', state:'idle', tag:'v1.5.6 · 运行中'},
    {id:'ver', parent:'root', name:'version.txt', state:'idle', tag:'1.5.6'},
    {id:'cache', parent:'root', name:'.app-update\\', state:'idle', tag:'暂存目录'},
  ];
  renderFS();
}
function node(id){ return STATE.fs.find(n=>n.id===id); }
function upsert(id,parent,name,state,tag){
  const ex=node(id);
  if(ex){ex.state=state;ex.tag=tag;} else STATE.fs.push({id,parent,name,state,tag});
  renderFS();
}
function renderFS(){
  $('fsTree').innerHTML = STATE.fs.map(n=>{
    const ind=n.parent?'<span class="indent">└─</span>':'';
    return `<div class="node-row st-${n.state}">${ind}<span class="dot"></span><span class="name">${n.name}</span><span class="tag">${n.tag||''}</span></div>`;
  }).join('');
}

function addLog(method,url,status,note,bad){
  const el=document.createElement('div');
  el.className='log';
  el.innerHTML=`<span class="m">${method}</span><span class="u">${url}<div style="color:${bad?'var(--bad)':'var(--ok)'}">${status}</div></span><span class="note">${note}</span>`;
  $('logs').prepend(el);
}

function setNode(id, cls){
  const g=$('n-'+id); if(g) g.setAttribute('class','node '+cls);
}
function setEdge(a,b,cls){
  const p=$('e-'+a+'-'+b); if(p) p.setAttribute('class','edge '+cls);
}
function setStep(text,desc){ $('stepText').textContent=text; $('stepDesc').textContent=desc; }
function setProgress(pct,received,total){
  $('bar').querySelector('i').style.width=pct+'%';
  $('pct').textContent=Math.round(pct)+'%';
}

/* 连线红点脉冲 */
function pulseOn(edgeId){
  const p=$('e-'+edgeId); if(!p) return;
  const len=p.getTotalLength();
  for(let i=0;i<3;i++){
    const c=el('circle',{class:'pulse',r:4});
    const anim=document.createElementNS(SVG_NS,'animateMotion');
    anim.setAttribute('dur',(1.4+i*0.3)+'s');
    anim.setAttribute('repeatCount','indefinite');
    anim.setAttribute('path',p.getAttribute('d'));
    c.appendChild(anim); p.parentNode.appendChild(c);
  }
}
function pulseOff(){ svg.querySelectorAll('.pulse').forEach(p=>p.remove()); }

/* 流程推进：把一组节点按序点亮 */
async function walk(nodes){
  for(const id of nodes){
    setNode(id,'active');
    const edge = EDGES.find(e=>e[1]===id);
    if(edge) pulseOn(edge[0]+'-'+edge[1]);
    await sleep(420);
    setNode(id,'done');
    if(edge) setEdge(edge[0],edge[1],'done');
    pulseOff();
  }
}

async function startCheck(manual){
  if(STATE.busy) return;
  STATE.busy=true;
  resetVisual();

  if(!manual){
    setStep('自动检查：间隔判断','距上次联网检查不足 24h，本次跳过，不请求服务器。');
    await sleep(700);
    STATE.busy=false; return;
  }

  setStep('① 请求云端版本','手动刷新：强制联网拉取最新 Release / latest-version.json。');
  addLog('GET','https://api.github.com/repos/demo/myshot/releases/latest','200','latest 端点不需要 tag；失败回退 releases 列表');
  await sleep(600);
  setNode('fetch','active'); await sleep(300); setNode('fetch','done'); setEdge('fetch','compare','done');

  setStep('② 比对版本 · 变更说明','远端 1.5.7 > 本地 1.5.6；回传版本号与 changelog。');
  addLog('CMP','本地 1.5.6  vs  远端 1.5.7','可更新','notes：截图吸附 / 录屏跟随 / 捕获会话自愈');
  setNode('compare','active'); await sleep(300); setNode('compare','done'); setEdge('compare','download','on');
  STATE.busy=false;
  // 弹出"用户确认"：演示中直接进入下载按钮态
  $('btnRestart').classList.remove('show');
}

async function runDownload(){
  STATE.busy=true;
  setStep('③ 下载到暂存残片','数据写入安装目录下 .app-update\\ 的 .part 残片，支持断点续传。');
  addLog('GET','…/myshot-1.5.7-windows-x64-online-update.zip.part','下载中','Range/206 续传；逐块写残片');
  upsert('part','cache','myshot-update.zip.part','new','下载残片');
  pulseOn('compare-download');

  const cancelAt = STATE.scenario==='cancel'?45:101;
  for(let p=0;p<=100;p+=2){
    await sleep(80);
    STATE.received=Math.floor(STATE.total*p/100);
    setProgress(p,STATE.received,STATE.total);
    node('part').tag=fmt(STATE.received)+' 字节'; renderFS();
    if(p>=cancelAt && STATE.scenario==='cancel'){ pulseOff(); return doCancel(); }
  }
  pulseOff();

  setStep('④ 校验 SHA256 / 大小','哈希与 .sha256 比对、字节数核对；通过后残片改名就位。');
  addLog('VERIFY','SHA256 整包校验 + 大小比对','通过','哈希一致，.part → myshot-update.zip');
  upsert('part','cache','myshot-update.zip','new','校验通过的新包');
  setNode('download','done'); setEdge('download','verify','done');
  setNode('verify','active'); await sleep(300); setNode('verify','done'); setEdge('verify','staging','done');

  setStep('⑤ 解压到 staging','新版文件先落到 .app-update\\staging\\，此时还不动安装目录。');
  addLog('UNZIP','更新包 → .app-update/staging/','完成','暂存区展开，等待旧程序退出');
  upsert('staging','cache','staging\\','new','解压展开的新文件');
  upsert('staging-exe','staging','MyShot.exe','new','新版可执行文件');
  setNode('staging','active'); await sleep(300); setNode('staging','done'); setEdge('staging','wait','on');

  // 停在 Ready：显示"重启软件"按钮
  setStep('下载完成，待重启','校验解压已就位；点"重启软件"才进入安装覆盖阶段。');
  $('btnRestart').classList.add('show');
  STATE.busy=false;
}

async function doApply(){
  STATE.busy=true;
  $('btnRestart').classList.remove('show');

  setStep('⑥ 等待旧程序退出','--parent-pid 轮询旧进程，释放被占用的 exe 句柄。');
  addLog('WAIT','--parent-pid 轮询旧进程句柄','已退出','旧程序退出后才允许替换 exe');
  setNode('wait','active'); await sleep(350); setNode('wait','done'); setEdge('wait','backup','done');

  setStep('⑦ 备份旧文件','安装目录下旧文件逐文件复制到 .app-update\\backup\\，供回滚。');
  addLog('BACKUP','旧 MyShot.exe → .app-update/backup/','完成','被替换文件先备份');
  upsert('backup','cache','backup\\','backup','旧文件备份');
  upsert('backup-exe','backup','MyShot.exe','backup','v1.5.6 副本');
  setNode('backup','active'); await sleep(350); setNode('backup','done'); setEdge('backup','apply','done');

  if(STATE.scenario==='rollback'){
    setStep('⑧ 覆盖中断 · 触发回滚','写入第二个文件时磁盘错误 / 占用，覆盖失败。');
    addLog('WRITE','覆盖 assets/ocr/… 写入','失败','中断，触发逐文件回滚');
    setNode('apply','active'); node('exe').state='replaced'; node('exe').tag='v1.5.7（部分）'; renderFS();
    await sleep(300); return doRollback();
  }

  setStep('⑧ staging 覆盖到安装目录','staging 里的文件逐文件覆盖回安装目录，先备份后替换。');
  addLog('APPLY','staging 文件逐文件覆盖到 install_dir','完成','单 exe 场景旧版旁置 .old');
  setNode('apply','active'); await sleep(350); setNode('apply','done'); setEdge('apply','verwrite','done');
  node('exe').state='replaced'; node('exe').tag='v1.5.7'; renderFS();

  setStep('⑨ 写回版本号','version.txt 更新为 1.5.7。');
  addLog('WRITE','version.txt → 1.5.7','完成','本地版本号更新');
  setNode('verwrite','active'); await sleep(300); setNode('verwrite','done'); setEdge('verwrite','launch','done');
  node('ver').state='replaced'; node('ver').tag='1.5.7'; renderFS();

  setStep('⑩ 拉起新版程序','脱离 updater 进程组启动安装目录下的 MyShot.exe，并写下启动探测标记。');
  addLog('SPAWN','CreateProcess(DETACHED_PROCESS)','已启动','新版启动，updater 随后进入探测');
  upsert('old','root','MyShot.exe.old','idle','上一版本旁置');
  upsert('marker','cache','.launch-marker','new','启动探测标记');
  setNode('launch','active'); await sleep(350); setNode('launch','done'); setEdge('launch','probe','done');

  setStep('⑪ 启动探测','updater 轮询 .launch-marker：新版启动后会删掉标记；在探测窗口内删除即认定成功。');
  addLog('PROBE','轮询 .launch-marker 是否被新版清除','通过','标记已被新版删除，启动探测成功');
  STATE.fs=STATE.fs.filter(n=>n.id!=='marker');
  renderFS();
  setNode('probe','active'); await sleep(350); setNode('probe','done'); setEdge('probe','cleanup','done');

  setStep('⑫ 清理临时文件','确认新版启动后，删除 staging / backup / 安装包 / 探测标记。');
  addLog('CLEANUP','删除 staging/backup/.old/安装包/标记','完成','临时产物全部清理');
  STATE.fs=STATE.fs.filter(n=>!['staging','staging-exe','backup','backup-exe','old'].includes(n.id));
  renderFS();
  setNode('cleanup','active'); await sleep(300); setNode('cleanup','done');

  setProgress(100,STATE.total,STATE.total);
  $('bar').classList.add('done');
  setStep('更新完成','MyShot 已重启为 1.5.7，临时文件与备份已清理。');
  STATE.busy=false;
}

async function doCancel(){
  setStep('下载已取消','只删除 .part 残片；尚未进入备份覆盖，旧版本未做任何改动。');
  addLog('CANCEL','下载循环检测到取消标志','已中断','删除残片，旧版保持原样');
  STATE.fs=STATE.fs.filter(n=>n.id!=='part');
  renderFS();
  setNode('download','fail');
  $('bar').classList.add('bad');
  await sleep(300);
  STATE.busy=false;
}

async function doRollback(){
  setStep('回滚：从备份逐文件还原','覆盖中断，或新版在探测窗口内未删掉标记（起不来），都按备份清单还原。');
  addLog('ROLLBACK','backup/ 旧文件逐文件还原到 install_dir','进行中','被部分覆盖的文件 / 起不来的新版，用备份副本还原');
  await sleep(400);
  node('exe').state='backup'; node('exe').tag='v1.5.6（已还原）'; renderFS();
  addLog('RESTORE','MyShot.exe 已从 backup 还原','完成','旧文件复位');
  upsert('blocked','cache','MyShot.exe.blocked','blocked','失败版本保留备查');
  node('ver').state='idle'; node('ver').tag='1.5.6'; renderFS();
  addLog('MARK','新版残留 → .blocked；version.txt 回写 1.5.6','完成','失败版本备查，下次可清理');
  STATE.fs=STATE.fs.filter(n=>!['staging','staging-exe','backup','backup-exe'].includes(n.id));
  renderFS();
  setNode('apply','fail'); setNode('cleanup','backup');
  $('bar').classList.add('bad');
  setStep('已回滚到 1.5.6','新版残留标记为 .blocked，用户继续使用旧版本。');
  STATE.busy=false;
}

function resetVisual(){
  $('logs').innerHTML='';
  $('bar').className='bar';
  setProgress(0,0,STATE.total);
  $('btnRestart').classList.remove('show');
  initFS();
  NODES.forEach(n=>setNode(n.id,'pending'));
  EDGES.forEach(([a,b])=>setEdge(a,b,''));
  pulseOff();
}

/* 事件绑定 */
$('btnRefresh').addEventListener('click',()=>startCheck(true));
$('btnRestart').addEventListener('click',()=>{ if(!STATE.busy) doApply(); });
document.querySelectorAll('.controls button[id^=sc]').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.controls button[id^=sc]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    STATE.scenario=b.id==='scSuccess'?'success':b.id==='scCancel'?'cancel':'rollback';
    resetVisual();
    setStep('待开始','已切换场景：'+(STATE.scenario==='success'?'成功更新':STATE.scenario==='cancel'?'中途取消':'失败回滚')+'。');
  });
});

initFS();
</script>
