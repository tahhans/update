[package]
name = "generic-updater"
version = "0.1.0"
edition = "2021"
description = "外置通用更新器：被任意语言的主程序调用，基于 GitHub Release 检查/下载/校验/旁置替换/回滚"
publish = false

[[bin]]
name = "generic-updater"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sha2 = "0.10"
hex = "0.4"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
thiserror = "2"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
